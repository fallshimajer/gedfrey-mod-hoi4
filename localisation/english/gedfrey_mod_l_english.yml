 gedfrey_politics_2_desc:0 "Broad political support gives the leader greater authority to enact policy."
 gedfrey_politics_3:0 "Political Consolidation III"
 gedfrey_politics_3_desc:0 "The leader commands near-total political legitimacy, generating exceptional political power each day."

